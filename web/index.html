<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Field Notes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Local research workspace</p>
      <h1>Field Notes</h1>
      <p>Capture observations, tag ideas, and find them again.</p>
    </header>

    <section class="composer" aria-labelledby="new-note-heading">
      <h2 id="new-note-heading">New note</h2>
      <form id="note-form">
        <label for="title">Title</label>
        <input id="title" name="title" autocomplete="off" required />
        <label for="body">Note</label>
        <textarea id="body" name="body" rows="5"></textarea>
        <label for="tags">Tags <span>(comma separated)</span></label>
        <input id="tags" name="tags" autocomplete="off" placeholder="research, follow-up" />
        <div class="form-actions">
          <button type="submit">Save note</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
      </form>
    </section>

    <section class="collection" aria-labelledby="notes-heading">
      <div class="collection-heading">
        <h2 id="notes-heading">Notes</h2>
        <label class="search-field" for="search">
          <span>Search</span>
          <input id="search" type="search" autocomplete="off" placeholder="Title, text, or tag" />
        </label>
      </div>
      <div id="notes" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
